name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  odoo-module:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: odoo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run the module tests on Odoo 18
        run: |
          docker compose up -d db
          docker compose run --rm odoo odoo -d test_coop -i coop_shopping_api \
            --test-enable --test-tags /coop_shopping_api --stop-after-init

  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/.flutter-version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
