name: coop_assistant
description: 'Shopping assistant for cooperative supermarkets running Odoo.'
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  dio: 5.11.1
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: 9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  go_router: 18.0.1
  intl: 0.20.3

dev_dependencies:
  build_runner: 2.16.1
  drift_dev: 2.35.2
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  mocktail: 1.0.5

flutter:
  uses-material-design: true
